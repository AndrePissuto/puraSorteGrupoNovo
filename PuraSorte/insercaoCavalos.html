<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estiloMain.css">
    <title>Inserção de cavalos e voltas</title>

</head>

<body>
    <div class="main colunar">
        <h1> Configure o turfe!</h1>
        <div id="QTDS" class="div_cards">
            <div class="div_inputs">
                <div class="icones">
                    <img src="./img/icone-cavalo.png" alt="icone-cavalo">
                </div>
                <div class="textos">
                    <p class="titulo-valor-aposta">Quantos cavalos?</p>
                    <input class="input-aposta" type="number" name="" id="ipt_qtdCavalo"
                        placeholder="Quantidade de cavalos">
                </div>
            </div>

            <div class="div_inputs">
                <div class="icones">
                    <img src="./img/icone-volta.png" alt="icone-volta">
                </div>

                <div class="textos">
                    <p class="titulo-valor-aposta">Quantas voltas?</p>
                    <input class="input-aposta" type="number" name="" id="ipt_qtdVoltas"
                        placeholder="Quantidade de voltas">
                </div>
            </div>
        </div>

        <button class="botao-apostar" onclick="adicionarCavalosEVoltas()">ADICIONAR</button>

    </div>

    <div id="Nomes" style="display: none;">
        <input type="text" name="" id="nome_cavalos" placeholder="nome do cavalo">
        <button onclick="adicionarNomes()">Inserir</button>
    </div>

    <div id="Corrida" style="display: none;">
        Vamos correr!
        <button onclick="jogar()">Correr</button>
        <div id="div_msg"></div>
    </div>


    <div class="ranking" style="display: none;">
        <button onclick="ranking()" class="botao-ranking">Ranking</button>
    </div>


</body>

</html>

<script>
    let vt_cavalos = [];
    let vt_corrida_cavalos = [];

    let cavalos = 0;
    let voltas = 0;

    function adicionarCavalosEVoltas() {
        cavalos = Number(ipt_qtdCavalo.value);
        voltas = Number(ipt_qtdVoltas.value);

        if (cavalos <= 1 || cavalos > 6 || cavalos % 1 > 0) {
            alert("A quantidade de cavalos deve estar entre 2 e 6 e deve ser um numero inteiro")
        } else if (voltas <= 0 || voltas > 10 || voltas % 1 > 0) {
            alert("A quantidade de voltas deve estar entre 1 e 10 e deve ser um numero inteiro")
        } else {
            QTDS.style.display = 'none';
            Nomes.style.display = 'flex';
            botaoDeInserir.style.display = 'none';
        }
    }

    function adicionarNomes() {
        let nome_cavalo = nome_cavalos.value.trim();

        if (vt_cavalos.length >= cavalos) {
            alert("A corrida não possui esse número de cavalos! Você tentou inserir 1 a mais");
        } else {
            for (let i = 0; i < cavalos; i++) {
                if (nome_cavalo.length < 3) {
                    alert("Nome deve conter mais de 2 caracteres!")
                    break;
                } else if (nome_cavalo == vt_cavalos[i]) {
                    alert("Esse nome já existe!")
                    break;
                } else {
                    vt_cavalos.push(nome_cavalo)
                    div_msg.innerHTML = vt_cavalos;
                    console.log(vt_cavalos)
                    break;
                }
            }
        }

        if (vt_cavalos.length == cavalos) {
            Nomes.style.display = 'none';
            Corrida.style.display = 'flex';
        }

    }




    function ranking() {

    }

    function esperar(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function jogar() {
        for (let j = 0; j < voltas; j++) {
            for (let i = 0; i < vt_cavalos.length; i++) {
                vt_corrida_cavalos[i] = Number((Math.random() * 2 + 7).toFixed(1));
                console.log(`${vt_cavalos[i]}: ${vt_corrida_cavalos[i]}`);
                div_msg.innerHTML += `${vt_cavalos[i]}: ${vt_corrida_cavalos[i]}<br><br>`;
            }

            if (j < voltas - 1) {
                await esperar(2000); // espera 2 segundos antes da próxima volta
            }
        }
    }

    jogar();




</script>
