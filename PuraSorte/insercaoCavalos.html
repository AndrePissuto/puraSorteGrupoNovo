<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estiloMain.css">
    <link rel="stylesheet" href="ranking.css">
    <link rel="stylesheet" href="style.css">
    <title>Inserção de cavalos e voltas</title>

</head>

<body>
    <div id="div_principal" class="main colunar">
        <h1 id="titulo-turfe"> Configure o turfe!</h1>
        <div id="QTDS" class="div_cards">
            <div class="div_inputs" id="qtd_cavalos">
                <div class="icones">
                    <img src="./img/icone-cavalo.png" alt="icone-cavalo">
                </div>
                <div class="textos">
                    <p class="titulo-valor-aposta">Quantos cavalos?</p>
                    <input class="input-aposta" type="number" name="" id="ipt_qtdCavalo"
                        placeholder="Quantidade de cavalos">
                </div>
            </div>

            <div class="div_inputs" id="qtd_voltas">
                <div class="icones">
                    <img src="./img/icone-volta.png" alt="icone-volta">
                </div>

                <div class="textos">
                    <p class="titulo-valor-aposta">Quantas voltas?</p>
                    <input class="input-aposta" type="number" name="" id="ipt_qtdVoltas"
                        placeholder="Quantidade de voltas">
                </div>
            </div>

            <div class="div_inputs colunar" id="nomes" style="display: none; width: 100%;">
                <img src="./img/icone-corredor.png" alt="imagem-corredor">
                <p class="titulo-valor-aposta">Qual o nome do pocotó?</p>
                <input class="input-aposta" type="text" name="" id="nome_cavalos" placeholder="Nome do cavalo">
                <div class="titulo-valor-aposta" id="div_msg"></div>
            </div>

            <div class="div_inputs" id="corrida" style="display: none;">
                <div id="pista" class="pista"></div>
            </div>

        </div>

        <button id="btn-add" class="botao-apostar" onclick="adicionarCavalosEVoltas()">ADICIONAR</button>
        <button style="display: none;" id="btn-add-nome" class="botao-apostar" onclick="adicionarNomes()">INSERIR
            NOME</button>
        <button style="display: none;" id="btn-corrida" class="botao-apostar" onclick="iniciarCorrida()">VAMOS
            CORRER!</button>
    </div>

    <div style="display: none;" id="ranking" class="div-select">
        <div class="container ranking">
            <div class="ranking_item">
                <div class="imagem">
                    <img style="width: 150px;" src="img/icone-cavalo.png">
                </div>
                <p class="ranking__city">Segundo</p>
                <div class="ranking_fundo">

                    <div class="ranking__rank segundo">2</div>
                </div>
            </div>

            <div class="ranking_item">
                <div class="imagem">
                    <img style="width: 150px;" src="img/icone-cavalo.png">
                    <img src="img/icone-campeao.png" style="width: 140px;" alt="">
                </div>
                <p class="ranking__city">Primeiro Lugar</p>
                <div class="ranking_fundo">

                    <div class="ranking__rank primeiro">1
                    </div>
                </div>
            </div>

            <div class="ranking_item">
                <div class="imagem">
                    <img style="width: 150px;;" src="img/icone-cavalo.png">
                </div>
                <p class="ranking__city">Terceiro</p>
                <div class="ranking_fundo">

                    <div class="ranking__rank terceiro">3</div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>

<script>
    let vt_cavalos = [];
    let vt_corrida_cavalos = [];

    let cavalos = 0;
    let voltas = 0;

    function adicionarCavalosEVoltas() {
        cavalos = Number(ipt_qtdCavalo.value);
        voltas = Number(ipt_qtdVoltas.value);

        if (cavalos <= 1 || cavalos > 6 || cavalos % 1 > 0) {
            alert("A quantidade de cavalos deve estar entre 2 e 6 e deve ser um numero inteiro")
        } else if (voltas <= 0 || voltas > 10 || voltas % 1 > 0) {
            alert("A quantidade de voltas deve estar entre 1 e 10 e deve ser um numero inteiro")
        } else {
            document.getElementById("qtd_cavalos").style.display = "none";
            document.getElementById("qtd_voltas").style.display = "none";
            document.getElementById("btn-add").style.display = "none";
            document.getElementById("nomes").style.display = "flex";
            document.getElementById("btn-add-nome").style.display = "block";
        }
    }

    function adicionarNomes() {
        let nome_cavalo = nome_cavalos.value.trim();

        if (vt_cavalos.length >= cavalos) {
            document.getElementById("nomes").style.display = "none";
            document.getElementById("btn-add-nome").style.display = "none";
            document.getElementById("btn-corrida").style.display = "block";
        } else {
            for (let i = 0; i < cavalos; i++) {
                if (nome_cavalo.length < 3) {
                    alert("Nome deve conter mais de 2 caracteres!")
                    break;
                } else if (nome_cavalo == vt_cavalos[i]) {
                    alert("Esse nome já existe!")
                    break;
                } else {
                    vt_cavalos.push(nome_cavalo)
                    div_msg.innerHTML = vt_cavalos;
                    document.getElementById("titulo-turfe").style.display = "none";
                    console.log(vt_cavalos)
                    break;
                }
            }
        }
    }

    function criarCavalos() {

        pista.innerHTML = "";
        corredores = [];

        let qtd = vt_cavalos.length;

        for (let i = 0; i < qtd; i++) {

            pista.innerHTML += `
            <div class="raia">
                <img
                    id="c${i}"
                    class="cavalo"
                    src="./img/spirit-pixel.gif">
            </div>
        `;
        }

        for (let i = 0; i < qtd; i++) {

            corredores.push({
                nome: `Cavalo ${i + 1}`,
                posicao: 0,
                elemento: document.getElementById(`c${i}`)
            });

        }
    }

    function iniciarCorrida() {

        document.getElementById("corrida").style.display = "flex";
        document.getElementById("btn-corrida").style.display = "none";


        criarCavalos();

        let voltas = Number(ipt_qtdVoltas.value);
        let voltaAtual = 0;

        let intervalo = setInterval(() => {

            for (let corredor of corredores) {

                let sorteio = Math.floor(Math.random() * 10) + 1;

                corredor.posicao += sorteio * 15;

                corredor.elemento.style.transform =
                    `translateX(${corredor.posicao}px)`;
            }

            voltaAtual++;

            if (voltaAtual >= voltas) {

                clearInterval(intervalo);
                document.getElementById("corrida").style.display = "none";
                mostrarResultado();
            }

        }, 1000);

    }

    function mostrarResultado() {

        document.getElementById("div_principal").style.display = "none";
        document.getElementById("ranking").style.display = "flex";

        corredores.sort((a, b) => b.posicao - a.posicao);

        console.log("Vencedor:", corredores[0].nome);

        for (let i = 0; i < corredores.length; i++) {

            console.log(
                `${i + 1}° lugar - ${corredores[i].nome}`
            );

        }
    }


</script>
